<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Summarizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #summary { white-space: pre-wrap; margin-top: 20px; background: #f0f0f0; padding: 10px; border-radius: 5px; }
    #loading { color: green; display: none; }
  </style>
</head>
<body>

  <h1>📄 PDF Summarizer (Client-side + Hugging Face)</h1>

  <input type="file" id="file-input" accept=".pdf" />
  <button onclick="handlePDF()">Summarize</button>

  <p id="loading">⏳ Extracting and summarizing...</p>
  <h2>Summary:</h2>
  <div id="summary"></div>

  <script>
    async function extractTextFromPDF(file) {
      const loadingTask = pdfjsLib.getDocument(URL.createObjectURL(file));
      const pdf = await loadingTask.promise;
      let text = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const strings = content.items.map(item => item.str);
        text += strings.join(' ') + '\n';
      }

      return text;
    }

    async function summarizeText(text) {
      const response = await fetch('https://api-inference.huggingface.co/models/facebook/bart-large-cnn', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer YOUR_HUGGINGFACE_API_KEY', // Replace this!
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          inputs: text.slice(0, 1000) // Limit to 1000 characters to avoid token overflow
        })
      });

      const data = await response.json();
      return data[0]?.summary_text || "No summary returned.";
    }

    async function handlePDF() {
      const fileInput = document.getElementById('file-input');
      const summaryDiv = document.getElementById('summary');
      const loading = document.getElementById('loading');

      if (!fileInput.files[0]) {
        alert("Please upload a PDF file.");
        return;
      }

      summaryDiv.textContent = '';
      loading.style.display = 'block';

      try {
        const text = await extractTextFromPDF(fileInput.files[0]);
        const summary = await summarizeText(text);
        summaryDiv.textContent = summary;
      } catch (err) {
        summaryDiv.textContent = '❌ Error: ' + err.message;
      } finally {
        loading.style.display = 'none';
      }
    }
  </script>

</body>
</html>
